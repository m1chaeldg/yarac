[workspace]
resolver = "2"
members = [
    "crates/yarac-core",
    "crates/yarac-parser",
    "crates/yarac-net",
    "crates/yarac-scripting",
    "crates/yarac-git",
    "crates/yarac-importer",
    "crates/yarac-mcp",
    "crates/yarac-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Yarac Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
indexmap = { version = "2.2", features = ["serde"] }
nom = "7.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "multipart", "stream"] }
reqwest_cookie_store = "0.8"
notify = "6.1"
keyring = "2.1"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
